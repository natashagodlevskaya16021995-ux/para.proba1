<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link id="font-link" rel="stylesheet" href="">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; height: 100vh; width: 100vw; font-family: sans-serif; }
        #ui { position: fixed; top: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 100; pointer-events: none; }
        #lives { display: flex; gap: 8px; margin-bottom: 10px; }
        .life { width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; transition: 0.3s; }
        #p-wrap { width: 200px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        #p-bar { width: 0%; height: 100%; transition: 0.3s; }
        
        .card { 
            position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center;
            display: flex; align-items: center; justify-content: center; text-align: center; 
            cursor: pointer; padding: 10px; box-sizing: border-box; user-select: none; will-change: transform;
        }

        /* Экраны */
        .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; text-align: center; padding: 20px; background: rgba(0,0,0,0.9); }
        .overlay h1 { margin: 0 0 15px; font-size: 32px; }
        .overlay p { margin: 0 0 25px; font-size: 18px; max-width: 80%; }
        .overlay img { max-height: 200px; margin-bottom: 20px; border-radius: 10px; }
        
        button { padding: 15px 30px; cursor: pointer; border-radius: 10px; border: none; font-weight: bold; font-size: 18px; transition: 0.2s; }
        button:hover { transform: scale(1.05); }

        #fb { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 160px; height: 160px; z-index: 1000; transition: 0.3s; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><div id="lives"></div><div id="p-wrap"><div id="p-bar"></div></div></div>
    <div id="game"></div><img id="fb">

    <div id="start-screen" class="overlay"><h1 id="st-t"></h1><p id="st-d"></p><button id="st-b" onclick="startGame()"></button></div>
    <div id="win-screen" class="overlay" style="display:none;"><img id="wi" src=""><h1 id="wt"></h1><p id="wd"></p><button class="rb" onclick="location.reload()"></button></div>
    <div id="lose-screen" class="overlay" style="display:none;"><img id="li" src=""><h1 id="lt"></h1><p id="ld"></p><button class="rb" onclick="location.reload()"></button></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const get = (n, d) => { let v = params.get(n); return (v===null||v==='null'||v==='') ? d : v; };

    // --- ИНТЕРФЕЙС ---
    document.getElementById('st-t').textContent = get('st_t', 'Привет!');
    document.getElementById('st-d').textContent = get('st_d', 'Найди пары');
    document.getElementById('st-b').textContent = get('st_b', 'ИГРАТЬ');
    document.getElementById('st-b').style.background = get('pcolor', '#03dac6');

    document.getElementById('wt').textContent = get('wt', 'Победа!');
    document.getElementById('wd').textContent = get('wd', 'Молодец!');
    document.getElementById('wi').src = get('wi', '');
    document.getElementById('lt').textContent = get('lt', 'Ой!');
    document.getElementById('ld').textContent = get('ld', 'Попробуй еще раз');
    document.getElementById('li').src = get('li', '');
    
    document.querySelectorAll('.rb').forEach(b => { 
        b.textContent = get('rb', 'ЗАНОВО');
        b.style.background = get('pcolor', '#03dac6');
    });

    // --- ДАННЫЕ ---
    const speed = parseFloat(get('speed', 2));
    const cSize = parseInt(get('csize', 140));
    
    let rawData = params.get('data');
    let data = {};
    try { if(rawData) data = JSON.parse(rawData); } catch(e) {}

    // Обработка ЛОВУШЕК
    const extra = get('extra', '').split(',').map(s => s.trim()).filter(s => s && s!=='null');
    
    const font = get('font', 'Arial');
    if (font !== 'Arial') {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${font.replace(/ /g, '+')}${get('effect','') ? '&effect='+get('effect','') : ''}`;
        document.head.appendChild(link);
        document.body.style.fontFamily = `'${font}', sans-serif`;
    }

    let deck = [];
    const pairEntries = Object.entries(data);
    pairEntries.forEach(([a, b], i) => {
        deck.push({t: a, id: i}); deck.push({t: b, id: i});
    });
    
    // Ловушки получают уникальный отрицательный ID, чтобы ни с кем не совпасть
    extra.forEach((word, i) => deck.push({t: word, id: -(i + 100)}));
    
    deck.sort(() => Math.random() - 0.5);

    let lives = 3, found = 0, selected = [], cards = [], gameStarted = false;
    document.getElementById('p-bar').style.backgroundColor = get('pcolor', '#03dac6');
    const lDiv = document.getElementById('lives');
    for(let i=0; i<3; i++) lDiv.innerHTML += `<div class="life" style="background-image:url('${get('lifeimg','')}')"></div>`;

    if (deck.length > 0) {
        deck.forEach(item => {
            const el = document.createElement('div');
            el.className = `card ${get('effect','')}`;
            el.textContent = item.t;
            el.style.width = cSize + 'px'; el.style.height = cSize + 'px';
            el.style.backgroundImage = `url('${get('cimg','')}')`;
            el.style.fontSize = get('fsize', '25px');
            el.style.color = get('fcolor', '#ffffff');
            
            el.onclick = () => {
                if(selected.length < 2 && !el.dataset.done) {
                    el.style.filter = "brightness(1.5) drop-shadow(0 0 10px white)";
                    selected.push({el, id: item.id});
                    if(selected.length === 2) {
                        const [s1, s2] = selected;
                        const fb = document.getElementById('fb');
                        // Проверка на совпадение и что это не ловушка (id >= 0)
                        if(s1.id === s2.id && s1.id >= 0) {
                            fb.src = get('winimg',''); found++;
                            document.getElementById('p-bar').style.width = (found/pairEntries.length)*100 + '%';
                            selected.forEach(s => { s.el.style.display = 'none'; s.el.dataset.done = '1'; });
                            if(pairEntries.length > 0 && found === pairEntries.length) {
                                gameStarted = false;
                                document.getElementById('win-screen').style.display = 'flex';
                            }
                        } else {
                            fb.src = get('loseimg',''); lives--;
                            const icons = document.querySelectorAll('.life');
                            if(icons[lives]) icons[lives].style.opacity = '0.1';
                            if(lives <= 0) {
                                gameStarted = false;
                                document.getElementById('lose-screen').style.display = 'flex';
                            }
                            selected.forEach(s => s.el.style.filter = "none");
                        }
                        fb.style.transform = 'translate(-50%, -50%) scale(1.1)';
                        setTimeout(() => fb.style.transform = 'translate(-50%, -50%) scale(0)', 700);
                        selected = [];
                    }
                }
            };
            const cObj = { el, x: Math.random()*(window.innerWidth-cSize), y: Math.random()*(window.innerHeight-cSize), vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed };
            document.getElementById('game').appendChild(el);
            cards.push(cObj);
        });
    }

    function startGame() {
        if(deck.length > 0) {
            document.getElementById('start-screen').style.display = 'none';
            gameStarted = true;
            loop();
        }
    }

    function loop() {
        if(!gameStarted) return;
        cards.forEach(c => {
            if(c.el.dataset.done) return;
            c.x += c.vx; c.y += c.vy;
            if(c.x < 0 || c.x > window.innerWidth-cSize) c.vx *= -1;
            if(c.y < 0 || c.y > window.innerHeight-cSize) c.vy *= -1;
            c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
        });
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
