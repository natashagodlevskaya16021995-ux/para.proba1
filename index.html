<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link id="font-link" rel="stylesheet" href="">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; height: 100vh; width: 100vw; }
        #ui { position: fixed; top: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 100; pointer-events: none; }
        #lives { display: flex; gap: 8px; margin-bottom: 10px; }
        .life { width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; transition: 0.3s; }
        #p-wrap { width: 200px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        #p-bar { width: 0%; height: 100%; transition: 0.3s; }
        .card { 
            position: absolute; 
            background-size: contain; background-repeat: no-repeat; background-position: center;
            display: flex; align-items: center; justify-content: center; text-align: center; 
            cursor: pointer; padding: 10px; box-sizing: border-box;
            user-select: none; background-color: transparent !important; will-change: transform;
        }
        #fb { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 160px; height: 160px; z-index: 1000; transition: 0.3s; pointer-events: none; }
        #win { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="ui"><div id="lives"></div><div id="p-wrap"><div id="p-bar"></div></div></div>
    <div id="game"></div><img id="fb">
    <div id="win"><h1>ПОБЕДА!</h1><button onclick="location.reload()" style="padding:10px 20px; cursor:pointer; border-radius:8px; border:none; background:#03dac6; font-weight:bold;">ЗАНОВО</button></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const speed = parseFloat(params.get('speed')) || 2;
    const data = JSON.parse(params.get('data') || '{}');
    const extra = (params.get('extra') || '').split(',').map(s => s.trim()).filter(s => s);
    const cSize = parseInt(params.get('csize')) || 140; // Размер карточки
    
    // Настройка шрифта
    const font = params.get('font') || 'Arial';
    if (font !== 'Arial') {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${font.replace(/ /g, '+')}${params.get('effect') ? '&effect='+params.get('effect') : ''}`;
        document.head.appendChild(link);
        document.body.style.fontFamily = `'${font}', sans-serif`;
    }

    let deck = [];
    const pairEntries = Object.entries(data);
    pairEntries.forEach(([a, b], i) => {
        deck.push({t: a, id: i});
        deck.push({t: b, id: i});
    });
    extra.forEach(word => deck.push({t: word, id: -99}));
    deck.sort(() => Math.random() - 0.5);

    let lives = 3, found = 0, selected = [], cards = [];
    document.getElementById('p-bar').style.backgroundColor = params.get('pcolor') || '#03dac6';
    const lDiv = document.getElementById('lives');
    for(let i=0; i<3; i++) lDiv.innerHTML += `<div class="life" style="background-image:url('${params.get('lifeimg')}')"></div>`;

    deck.forEach(item => {
        const el = document.createElement('div');
        el.className = `card ${params.get('effect') || ''}`;
        el.textContent = item.t;
        el.style.width = cSize + 'px';
        el.style.height = cSize + 'px';
        el.style.backgroundImage = `url('${params.get('cimg')}')`;
        el.style.fontSize = params.get('fsize') || '25px';
        el.style.color = params.get('fcolor') || '#ffffff'; // Цвет текста
        
        el.onclick = () => {
            if(selected.length < 2 && !el.dataset.done) {
                el.style.filter = "brightness(1.5) drop-shadow(0 0 10px white)";
                selected.push({el, id: item.id});
                if(selected.length === 2) {
                    const [s1, s2] = selected;
                    const fb = document.getElementById('fb');
                    if(s1.id === s2.id && s1.id !== -99) {
                        fb.src = params.get('winimg'); found++;
                        document.getElementById('p-bar').style.width = (found/pairEntries.length)*100 + '%';
                        selected.forEach(s => { s.el.style.display = 'none'; s.el.dataset.done = '1'; });
                        if(found === pairEntries.length) document.getElementById('win').style.display = 'flex';
                    } else {
                        fb.src = params.get('loseimg'); lives--;
                        const icons = document.querySelectorAll('.life');
                        if(icons[lives]) icons[lives].style.opacity = '0.1';
                        if(lives <= 0) setTimeout(() => location.reload(), 1000);
                        selected.forEach(s => s.el.style.filter = "none");
                    }
                    fb.style.transform = 'translate(-50%, -50%) scale(1.1)';
                    setTimeout(() => fb.style.transform = 'translate(-50%, -50%) scale(0)', 700);
                    selected = [];
                }
            }
        };
        const cObj = { el, x: Math.random()*(window.innerWidth-cSize), y: Math.random()*(window.innerHeight-cSize), vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed };
        document.getElementById('game').appendChild(el);
        cards.push(cObj);
    });

    function loop() {
        cards.forEach(c => {
            if(c.el.dataset.done) return;
            c.x += c.vx; c.y += c.vy;
            if(c.x < 0 || c.x > window.innerWidth-cSize) c.vx *= -1;
            if(c.y < 0 || c.y > window.innerHeight-cSize) c.vy *= -1;
            c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
        });
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
